name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository.
permissions:
  contents: read

# A newer push to the same ref makes the running job irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Language server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Through the Makefile, not by spelling the commands out again: a
      # contributor running `make lint` green must not still fail here.
      # `server` is its own workspace, so the root `cargo fmt` does not reach
      # it — `make fmt` and `make lint` are what do.
      - name: Lint
        run: make lint

      # Includes the comparator gate: tests/differential.rs checks version
      # ordering against a checked-in corpus of osv-scalibr's answers.
      - name: Test
        run: make test

      - name: Build
        run: make server

  extension:
    name: Extension shim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml pins the channel and the wasm32-wasip1 target, so
      # rustup installs both without this workflow naming either.
      - name: Check formatting
        run: cargo fmt --check

      # Runs on the host, not wasm: these cover the checksum verification, which
      # is the one piece of the shim that must not silently pass.
      - name: Test
        run: cargo test

      - name: Build the wasm shim
        run: cargo build --release --target wasm32-wasip1
