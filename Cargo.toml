# Two crates: this one, the Zed extension shim, built to wasm; and the language
# server under server/, built for the host. Only the shim is a default member,
# so a bare `cargo build --target wasm32-wasip1` never tries to build the
# server for wasm; the Makefile names the server explicitly with `-p`.
[workspace]
members = ["server"]
default-members = ["."]

[package]
name = "zed_package_checker"
version = "0.0.2"
edition = "2021"
publish = false
license = "Apache-2.0"

[lib]
path = "src/lib.rs"
# rlib alongside cdylib so the checksum logic can be unit-tested. A verifier
# that is never exercised is the same hazard as a lint gate that exits zero.
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"
sha2 = { version = "0.10", default-features = false }
# 0.8.0 exists in-tree but is marked publish = false; 0.7.0 is the crates.io max.
zed_extension_api = "0.7"

# One profile for everything that is measured, so a binary-size or wall-time
# number never quietly compares different optimisation settings. Applies to
# both crates: Cargo honours profiles in the workspace root only.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
