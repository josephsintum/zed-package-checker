id = "package-checker"
name = "Package Checker"
description = "Flags vulnerable and malicious dependencies as diagnostics, from OSV.dev."
version = "0.0.1"
schema_version = 1
authors = ["Joseph Sintum <josephsintum@gmail.com>"]
repository = "https://github.com/josephsintum/zed-package-checker"

[language_servers.package-checker]
name = "Package Checker"
# One server instance runs per worktree regardless of how many languages are
# listed (Zed keys instances by worktree + server name, not language), so
# listing broadly only adds start triggers, not processes.
#
# Source languages are listed deliberately: opening any .go/.py/.ts file starts
# the server, which then scans the whole project including manifests that have
# no Zed language of their own (yarn.lock, go.sum, poetry.lock).
#
# TOML is third-party (zed-extensions/toml) and simply inert when absent.
languages = [
    "JSON",
    "JSONC",
    "Go",
    "Go Mod",
    "Python",
    "Plain Text",
    "TOML",
    "YAML",
    "JavaScript",
    "TypeScript",
    "TSX",
    "Rust",
]
code_action_kinds = ["quickfix"]

# A second server for side-by-side comparison during development. Zed keys a
# server instance by worktree and server name, so declaring two runs two, and
# their diagnostics merge in the panel. Each is told what to call itself with
# --label, because the `source` field is what distinguishes them there.
#
# Nothing points at a binary by default: set
# `lsp.package-checker-go.binary.path` to enable it. Absent that, Zed reports
# it as failed to start and everything else carries on.
[language_servers.package-checker-go]
name = "Package Checker (Go)"
languages = [
    "JSON",
    "JSONC",
    "Go",
    "Go Mod",
    "Python",
    "Plain Text",
    "TOML",
    "YAML",
    "JavaScript",
    "TypeScript",
    "TSX",
    "Rust",
]
