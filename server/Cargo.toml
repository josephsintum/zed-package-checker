# One crate, flat modules: module privacy gives every dependency boundary this
# server needs, so extra crates would buy nothing but directories.
[package]
name = "package-checker"
version = "0.0.2"
description = "A language server that flags vulnerable and malicious dependencies"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
name = "package_checker"
path = "src/lib.rs"

[[bin]]
name = "package-checker-lsp"
path = "src/main.rs"

[features]
# A counting global allocator, for reporting what the index retains. Opt-in
# because its atomic counter is contended by every thread during a parallel
# load, which distorts the very timings the other half of the benchmark takes.
count-alloc = []

[dependencies]
arc-swap = "1"
crc32c = "0.6"
cvss = "2.2"
ignore = "0.4"
jsonc-parser = "0.33"
memmap2 = "0.9"
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-std", "signal"] }
tower-lsp-server = "0.23"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = "3"
zip = { version = "8", default-features = false, features = ["deflate"] }

[dev-dependencies]
flate2 = "1"
futures = "0.3"
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }

# One profile for everything that is measured, so a binary-size or wall-time
# number never quietly compares different optimisation settings.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
large_enum_variant = "warn"
needless_pass_by_value = "warn"
redundant_clone = "warn"
doc_markdown = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
